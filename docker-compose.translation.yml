# Opt-in, independent local PDF translation worker. It reuses the current API
# image and mounted application code, but installs translation libraries in a
# separate virtual environment in the translation-worker image.
services:
  translation-worker:
    image: myra-translation-worker:latest
    build:
      context: .
      dockerfile: infrastructure/translation/Dockerfile
      args:
        BASE_TRANSLATION_IMAGE: ${BASE_TRANSLATION_IMAGE:-myra-api:latest}
        REUSE_TRANSLATION_ENV: ${REUSE_TRANSLATION_ENV:-0}
    restart: unless-stopped
    env_file:
      - path: .local/runtime/local-app.env
        required: true
      - path: .local/observability/app.env
        required: true
    environment:
      MYRA_RUNTIME_PROFILE: local
      MYRA_OBSERVABILITY_ENABLED: "true"
      MYRA_TRANSLATION_TEST_RUN: ${MYRA_TRANSLATION_TEST_RUN:-false}
      MYRA_TRANSLATION_MODEL_PATH: /opt/myra-translation/nllb
      LANGFUSE_BASE_URL: http://langfuse-web:3000
    depends_on:
      myra-local-postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./apps/api/app
        target: /app/app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/translation/babeldoc
        target: /tmp/.cache/babeldoc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/translation/nllb
        target: /opt/myra-translation/nllb
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/runtime/files
        target: /app/data
        bind:
          create_host_path: false
