# Opt-in, independent PDF translation worker. It reuses the current API image
# and mounted application code, but installs translation libraries in a
# separate virtual environment in the translation-worker image.
services:
  translation-worker:
    image: myra-translation-worker:latest
    build:
      context: .
      dockerfile: infrastructure/translation/Dockerfile
      args:
        BASE_API_IMAGE: myra-api:latest
    restart: unless-stopped
    env_file:
      - path: .local/observability/app.env
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured in the existing environment}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      MYRA_OBSERVABILITY_ENABLED: "true"
      MYRA_TRANSLATION_TEST_RUN: ${MYRA_TRANSLATION_TEST_RUN:-false}
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      MYRA_RETENTION_STATE_PATH: /run/myra-retention/retention-state.json
    volumes:
      - type: bind
        source: ./apps/api/app
        target: /app/app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/translation/babeldoc
        target: /tmp/.cache/babeldoc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/observability/retention
        target: /run/myra-retention
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/gcloud
        target: /root/.config/gcloud
        read_only: true
        bind:
          create_host_path: false
