# Opt-in local observability stack. Start only after running
# infrastructure/observability/setup.py; see its README for commands.
services:
  api:
    env_file:
      - path: .local/observability/app.env
        required: true
    environment:
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      MYRA_RETENTION_STATE_PATH: /run/myra-retention/retention-state.json
      MYRA_OBSERVABILITY_ENABLED: "true"
      MYRA_CACHE_ENABLED: "true"
    volumes:
      - type: bind
        source: ./.local/observability/retention
        target: /run/myra-retention
        read_only: true
        bind:
          create_host_path: false
    networks:
      - default
      - myra-cache-internal

  worker:
    env_file:
      - path: .local/observability/app.env
        required: true
    environment:
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      MYRA_RETENTION_STATE_PATH: /run/myra-retention/retention-state.json
      MYRA_OBSERVABILITY_ENABLED: "true"
      MYRA_CACHE_ENABLED: "true"
    volumes:
      - type: bind
        source: ./.local/observability/retention
        target: /run/myra-retention
        read_only: true
        bind:
          create_host_path: false
    networks:
      - default
      - myra-cache-internal

  langfuse-retention:
    image: myra-api:latest
    user: "${MYRA_UID:-1000}:${MYRA_GID:-1000}"
    restart: unless-stopped
    environment:
      LANGFUSE_BASE_URL: http://langfuse-web:3000
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - while true; do python /app/infrastructure/observability/retention.py --credentials-dir /run/observability --state-dir /run/myra-retention || true; sleep 3600; done
    volumes:
      - ./infrastructure/observability:/app/infrastructure/observability:ro
      - ./.local/observability:/run/observability:ro
      - ./.local/observability/retention:/run/myra-retention:rw
    networks:
      - default

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.48.0@sha256:8c1b80ed7735be587974d603af0f6e0247b33d3b56c7d5ab9d2337aec313efa0
    restart: unless-stopped
    env_file:
      - path: .local/observability/langfuse-web.env
        required: true
    environment:
      HOSTNAME: 0.0.0.0
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - default
      - langfuse-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.48.0@sha256:9349b003a453326b3d2e2033eb94fe5ca9ee12ee237779c10984b9d3dfe0f8ed
    restart: unless-stopped
    env_file:
      - path: .local/observability/langfuse-worker.env
        required: true
    environment:
      HOSTNAME: 0.0.0.0
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  langfuse-postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    env_file:
      - path: .local/observability/postgres.env
        required: true
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12.3.21-alpine@sha256:74da41cd61db84f652c6364fd30d59e19b7276d34f7c82515f5f0e70d6f325da
    restart: unless-stopped
    user: "101:101"
    env_file:
      - path: .local/observability/clickhouse.env
        required: true
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  langfuse-minio:
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    restart: unless-stopped
    entrypoint: ["sh"]
    command:
      - "-ec"
      - "mkdir -p /data/langfuse && exec minio server --address ':9000' --console-address ':9001' /data"
    env_file:
      - path: .local/observability/minio.env
        required: true
    volumes:
      - langfuse_minio_data:/data
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  langfuse-redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    restart: unless-stopped
    env_file:
      - path: .local/observability/langfuse-redis.env
        required: true
    command:
      - sh
      - -ec
      - exec redis-server --requirepass "$${LANGFUSE_REDIS_PASSWORD}" --maxmemory-policy noeviction --appendonly yes
    volumes:
      - langfuse_redis_data:/data
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${LANGFUSE_REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  myra-cache:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    restart: unless-stopped
    env_file:
      - path: .local/observability/myra-cache.env
        required: true
    command:
      - sh
      - -ec
      - exec redis-server --requirepass "$${MYRA_CACHE_PASSWORD}" --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    networks:
      - myra-cache-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${MYRA_CACHE_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:

networks:
  langfuse-internal:
    internal: true
  myra-cache-internal:
    internal: true
