services:
  api:
    image: myra-api:latest
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/alembic:/app/alembic
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
      - ${HOME}/.cache/huggingface/hub:/root/.cache/huggingface/hub:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

  worker:
    image: myra-api:latest
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/alembic:/app/alembic
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
      - ${HOME}/.cache/huggingface/hub:/root/.cache/huggingface/hub:ro
    command: python -m app.worker
    depends_on:
      - api

  neo4j:
    image: neo4j:5.26.0-community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-none}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  neo4j_data:

