[project]
name = "myra-translation-engine"
version = "0.1.0"
description = "Isolated PDFMathTranslate-next runtime for mYrA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pdf2zh-next==2.9.0",
    "babeldoc==0.6.2",
    "httpx>=0.27,<1.0",
    "huggingface-hub==0.30.2",
    "sentencepiece==0.2.0",
    "torch==2.14.1+cu126",
    "transformers==4.49.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
