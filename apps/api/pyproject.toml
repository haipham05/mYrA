[project]
name = "myra-api"
version = "0.1.0"
description = "FastAPI service for mYrA"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1.0",
    "docling>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "google-cloud-storage>=2.14,<3.0",
    "httpx>=0.27",
    "langfuse==4.16.0",
    "neo4j>=5.18,<6.0",
    "psycopg2-binary>=2.9.9",
    "pypdf>=4.0,<6.0",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
